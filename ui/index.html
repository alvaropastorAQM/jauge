<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jauge</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="panneau" id="panneau">
  <header class="tete" data-tauri-drag-region>
    <div class="marque" data-tauri-drag-region>
      <svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><circle class="logo-piste" cx="10" cy="10" r="7"/><circle class="logo-arc" id="logo-arc" cx="10" cy="10" r="7" pathLength="100"/></svg>
      <h1 data-tauri-drag-region>Jauge</h1>
      <span class="badge" id="forfait" hidden></span>
    </div>
    <div class="actions">
      <div class="direct" id="direct" data-tauri-drag-region><span class="voyant"></span><span id="direct-texte">connecting…</span></div>
      <button type="button" class="btn-carre" id="actualiser" aria-label="Refresh now" title="Refresh now">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
      </button>
      <button type="button" class="btn-carre" id="fermer" aria-label="Quit Jauge" title="Quit Jauge" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </header>

  <section class="resume" aria-label="Summary">
    <div class="kpi">
      <div class="kpi-libelle">API equivalent</div>
      <div class="kpi-valeur" id="cout">…</div>
      <div class="kpi-contexte" id="cout-contexte">Reading your logs…</div>
    </div>
    <div class="kpi">
      <div class="kpi-libelle">Closest limit</div>
      <div class="kpi-valeur" id="proche">…</div>
      <div class="kpi-contexte" id="proche-contexte"></div>
    </div>
  </section>

  <section class="limites" id="limites" aria-label="Limits" aria-live="polite"></section>

  <footer class="pied" id="pied" hidden><span id="pied-texte"></span></footer>
</main>
<script src="js/pont.js"></script>
<script src="js/rythme.js"></script>
<script src="js/vue.js"></script>
</body>
</html>
